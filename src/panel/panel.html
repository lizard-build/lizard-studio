<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Lizard Studio — Claude Code &amp; ChatGPT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="startup.css" />
  </head>
  <body>
    <div id="panel-startup" class="panel-startup" role="status" aria-live="polite">
      <span class="panel-startup-title">Lizard Studio</span>
      <span id="panel-startup-message">Opening chats…</span>
      <button id="panel-startup-retry" type="button" hidden>Retry</button>
    </div>
    <main class="views">
      <section id="view-chat" class="view"></section>
    </main>

    <!-- Terminal view is kept in the codebase (terminal.js / xterm vendor) but
         disabled in the UI for now. Re-add its tab + scripts to bring it back. -->

    <!-- Let Chrome show this document before loading the full chat UI. -->
    <script src="startup.js"></script>
  </body>
</html>
